---
name: test

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches:
      - main

jobs:
  test:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27'

      - name: Lint
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: make lint

      - name: Test
        run: make test

      - name: Publish coverage to coveralls.io
        uses: shogo82148/actions-goveralls@77a1912dca42260ee3e97f61bd13ea7ef40baa93 # v1
        if: ${{ matrix.os == 'ubuntu-latest' }}
        with:
          path-to-profile: coverage.out

      - name: Build
        run: go build ./cmd/gitlab-ci-pipelines-exporter
